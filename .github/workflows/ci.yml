
name: CloudDeploy CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build -t clouddeploy .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy application to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app,tests,frontend,Dockerfile,requirements.txt"
          target: "~/CloudDeploy"
          overwrite: true

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          COMMIT_ID: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: COMMIT_ID
          script: |
            set -e
            cd ~/CloudDeploy

            SHORT_COMMIT=${COMMIT_ID:0:7}
            IMAGE="clouddeploy:$SHORT_COMMIT"

            # Build the new image before touching production
            docker build -t "$IMAGE" .

            # Record the current production image for rollback
            PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' clouddeploy-app)
            echo "Previous production image: $PREVIOUS_IMAGE"

            # Ensure persistent volumes exist
            docker volume create clouddeploy-data >/dev/null
            docker volume create clouddeploy-candidate-data >/dev/null

            # Back up the production database before deployment
            docker run --rm \
              -v clouddeploy-data:/data:ro \
              -v "$HOME:/backup" \
              python:3.13-slim \
              python -c "import sqlite3; src=sqlite3.connect('file:/data/tasks.db?mode=ro', uri=True); dst=sqlite3.connect('/backup/clouddeploy-tasks-predeploy.db'); src.backup(dst); dst.close(); src.close()"

            # Verify the backup file was created
            test -s "$HOME/clouddeploy-tasks-predeploy.db"
            echo "Production database backup verified"

            # Verify that the production database is readable
            docker run --rm \
              -v clouddeploy-data:/data:ro \
              -e DATABASE_PATH=/data/tasks.db \
              "$IMAGE" \
              python -c "import sqlite3; c=sqlite3.connect('file:/data/tasks.db?mode=ro', uri=True); print('Production tasks:', c.execute('SELECT COUNT(*) FROM tasks').fetchone()[0]); c.close()"

            # Start the candidate with its own test database volume
            docker rm -f clouddeploy-candidate || true
            docker run -d \
              --name clouddeploy-candidate \
              -p 127.0.0.1:5001:5000 \
              -v clouddeploy-candidate-data:/data \
              -e DATABASE_PATH=/data/tasks.db \
              "$IMAGE"

            # Wait for candidate health check
            for i in $(seq 1 15); do
              if curl -fsS http://localhost:5001/health >/dev/null; then
                break
              fi
              sleep 2
            done

            # Stop deployment if candidate health check fails
            if ! curl -fsS http://localhost:5001/health >/dev/null; then
              docker logs clouddeploy-candidate
              docker rm -f clouddeploy-candidate || true
              exit 1
            fi

            # Verify the candidate tasks API responds
            if ! curl -fsS http://localhost:5001/tasks >/dev/null; then
              docker logs clouddeploy-candidate
              docker rm -f clouddeploy-candidate || true
              exit 1
            fi

            # Candidate passed checks; remove it
            docker rm -f clouddeploy-candidate

            # Replace production with the new image
            docker stop clouddeploy-app
            docker rm clouddeploy-app

            docker run -d \
              --restart unless-stopped \
              -p 5000:5000 \
              --name clouddeploy-app \
              -v clouddeploy-data:/data \
              -e DATABASE_PATH=/data/tasks.db \
              "$IMAGE"

            # Verify production health after startup
            for i in $(seq 1 15); do
              if curl -fsS http://localhost:5000/health >/dev/null; then
                echo "Deployed commit: $SHORT_COMMIT"
                exit 0
              fi
              sleep 2
            done

            # Collect logs and roll back if new production fails
            docker logs clouddeploy-app || true
            docker rm -f clouddeploy-app || true

            docker run -d \
              --restart unless-stopped \
              -p 5000:5000 \
              --name clouddeploy-app \
              -v clouddeploy-data:/data \
              -e DATABASE_PATH=/data/tasks.db \
              "$PREVIOUS_IMAGE"

            echo "Rollback attempted to image: $PREVIOUS_IMAGE"
            exit 1
