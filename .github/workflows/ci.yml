name: CloudDeploy CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build -t clouddeploy .

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy application to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app,tests,Dockerfile,requirements.txt"
          target: "~/CloudDeploy"
          overwrite: true

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/CloudDeploy

            COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")

            docker stop clouddeploy-app || true
            docker rm clouddeploy-app || true

            docker build -t clouddeploy:$COMMIT .
            docker run -d -p 5000:5000 --name clouddeploy-app clouddeploy:$COMMIT

            echo "Deployed commit: $COMMIT"